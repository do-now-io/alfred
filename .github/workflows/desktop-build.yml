# Build desktop Alfred (Tauri) — Windows / macOS / Linux.
#
# Windows → .msi + .exe (NSIS), **signés** (SSL.com eSigner, OV, cloud HSM — pas de
# clé privée locale/token, cf. spec/12 + scripts/sign-windows.ps1) si les secrets
# ESIGNER_* sont configurés sur le repo, sinon NON signé (fallback silencieux).
# macOS → .dmg, **signé** (Developer ID Application) si les secrets APPLE_CERTIFICATE*
# sont configurés, sinon NON signé — **notarisation pas encore branchée** (décision
# explicite, à faire plus tard : Gatekeeper avertit encore au 1er lancement même signé).
# Linux → .deb + .rpm + .AppImage : NON signés (pas de mécanisme équivalent attendu par
# l'écosystème Linux pour ces formats).
#
# Déclenchement : manuel (onglet Actions → Run workflow) ou tag `v*`.
# Pas de build sur chaque push : la compilation de Whisper (cmake) rend le job
# lourd ; le cache cargo amortit les exécutions suivantes.
#
# Particularités du repo reproduites ici (mêmes étapes que scripts/*.ps1) :
#   - macros sqlx::query! vérifiées à la compilation → il faut créer
#     src-tauri/alfred_dev.db + migrations AVANT cargo (DATABASE_URL vient de
#     src-tauri/.env, commité ; le cache .sqlx est volontairement gitignoré).
#   - whisper-rs (feature par défaut) → cmake + libclang (bindgen).
#   - AUCUN modèle Whisper embarqué : il est téléchargé à l'onboarding
#     (`download_model`) — rien à préparer côté CI.

name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x86_64
          - os: windows-latest
            label: Windows x86_64
          - os: macos-latest
            label: macOS Apple Silicon
          # Pas de macOS Intel : les runners macos-13 ne sont plus provisionnés
          # (jobs restés en file >14 h) — couvrir les Mac Intel via le build
          # universel signé (Phase E) si le besoin se confirme.

    steps:
      - uses: actions/checkout@v4

      # Tauri v2 (webkit2gtk 4.1, appindicator, rsvg) + cpal/ALSA + bindgen.
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libclang-dev cmake

      # whisper-rs/bindgen a besoin de libclang.dll ; LLVM est préinstallé sur
      # les runners GitHub Windows — on installe seulement s'il manque.
      - name: libclang (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ ! -f "/c/Program Files/LLVM/bin/libclang.dll" ]; then
            choco install -y llvm
          fi
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Cache cargo + target (whisper.cpp est le gros du temps de compilation).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Binaire précompilé (évite ~5 min de `cargo install sqlx-cli`).
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Base sqlx de compilation (migrations)
        working-directory: src-tauri
        shell: bash
        run: |
          sqlx database create
          sqlx migrate run

      - name: npm ci
        run: npm ci

      # Signature macOS (Developer ID Application, spec/12) — **notarisation pas
      # encore branchée** (décision explicite, à faire plus tard) : l'app sera
      # signée mais Gatekeeper affichera quand même un avertissement au premier
      # lancement (clic droit → Ouvrir), plus strict que sans signature du tout
      # sur les versions macOS récentes qui bloquent carrément un .app non
      # notarié — mais un premier pas. Mot de passe de keychain généré à la
      # volée (jetable, ne sert qu'à cette exécution CI). No-op si les secrets
      # APPLE_CERTIFICATE* sont absents (fork/PR sans accès aux secrets) : la
      # variable d'environnement `APPLE_SIGNING_IDENTITY` reste alors vide et
      # Tauri produit un `.dmg` non signé, comme avant.
      - name: Importer le certificat Apple (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Secrets APPLE_CERTIFICATE* absents — build macOS non signe."
            exit 0
          fi
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::Aucune identite 'Developer ID Application' trouvee dans le certificat importe."
            exit 1
          fi
          echo "Identite trouvee : $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # beforeBuildCommand (tauri.conf.json) enchaîne tsc + vite build.
      # ALFRED_METRICS_APP_KEY (secret repo, optionnel) : clé anti-spam metrics
      # (spec/15 §D) embarquée à la compilation — doit correspondre au
      # METRICS_APP_KEY configuré côté Coolify. Vide en local (pas bloquant,
      # le backend n'exige le header que s'il a lui-même une clé configurée).
      # ALFRED_GOOGLE_CLIENT_ID/SECRET (spec/02 §1, secrets repo) : client OAuth
      # "Desktop app" du calendrier Google, embarqué à la compilation
      # (`option_env!`, calendar.rs) — client PUBLIC (Google ne traite pas son
      # secret comme confidentiel pour ce type de client), c'est la pratique
      # attendue. Vide en local (bouton "Connecter Google Calendar" désactivé
      # avec une erreur explicite) — sans effet bloquant sur le reste du build.
      # Garder le client en statut "Testing" côté Google Cloud Console tant
      # qu'on reste à ~10 utilisateurs (voir commentaire en tête de calendar.rs).
      # APPLE_* (macOS uniquement, secrets repo) : signature — cf. étape
      # précédente. `APPLE_SIGNING_IDENTITY` vient de `$GITHUB_ENV`, posé par
      # elle ; vide sur Windows/Linux et sans effet là-bas (Tauri ne signe
      # macOS que pour la cible macOS).
      # TAURI_SIGNING_PRIVATE_KEY* (spec/27, secrets repo) : signature du CONTENU
      # de mise à jour (paire de clés dédiée, générée une fois via
      # `npm run tauri signer generate`, distincte de la signature Windows/macOS
      # ci-dessus) — le bundler Tauri génère automatiquement un `.sig` à côté de
      # chaque artefact éligible à l'update (nsis/msi, .app.tar.gz) dès que
      # `plugins.updater` est configuré (tauri.conf.json) ET que ces variables
      # sont présentes. No-op silencieux si les secrets sont absents : pas de
      # `.sig` généré, `latest.json` (job `release`) sera alors incomplet pour
      # cette plateforme plutôt que d'échouer le build.
      - name: Build Tauri
        env:
          ALFRED_METRICS_APP_KEY: ${{ secrets.ALFRED_METRICS_APP_KEY }}
          ALFRED_GOOGLE_CLIENT_ID: ${{ secrets.ALFRED_GOOGLE_CLIENT_ID }}
          ALFRED_GOOGLE_CLIENT_SECRET: ${{ secrets.ALFRED_GOOGLE_CLIENT_SECRET }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build

      # Signature Windows via SSL.com eSigner — étape CI À PART plutôt qu'un hook
      # `signCommand` de tauri.conf.json (celui-ci échouait systématiquement en CI,
      # "failed to run powershell", 4 configurations différentes testées sans
      # qu'on puisse observer la vraie cause). No-op silencieux si les secrets
      # ESIGNER_* sont absents (fork/PR sans accès aux secrets).
      - name: Signer les binaires Windows (eSigner)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
        run: |
          ./scripts/sign-windows.ps1 -Paths `
            "src-tauri/target/release/alfred.exe", `
            "src-tauri/target/release/bundle/msi/*.msi", `
            "src-tauri/target/release/bundle/nsis/*.exe"

      # BUG corrigé (spec/27) : eSigner réécrit les octets du `.exe` (certificat
      # Authenticode embarqué) — le `.sig` updater calculé pendant "Build Tauri"
      # portait donc sur un fichier qui n'existe plus une fois signé, et
      # `minisign-verify` rejetait la mise à jour côté client ("signature
      # verification failed") même avec une clé/config parfaitement correctes.
      # On régénère le `.sig` ICI, sur le binaire FINAL (post-eSigner), avec la
      # même clé privée que "Build Tauri". No-op silencieux si les secrets
      # updater sont absents (cohérent avec "Build Tauri" — pas de `.sig` du
      # tout dans ce cas, `latest.json` omettra windows-x86_64).
      - name: Régénérer le .sig updater Windows (post-signature eSigner)
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Secret TAURI_SIGNING_PRIVATE_KEY absent — pas de .sig a regenerer."
            exit 0
          fi
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            npm run tauri -- signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$f"
          done

      # Retire le numéro de version du nom des binaires et uniformise la casse
      # (deb/rpm/AppImage sont générés en lowercase par le bundler) : noms
      # stables entre releases, utilisables via releases/latest/download/...
      # côté site. Fait après la signature (le contenu du fichier ne change
      # pas), avant l'upload.
      #   Alfred_0.2.11_aarch64.dmg      → Alfred_aarch64.dmg
      #   Alfred_0.2.11_x64-setup.exe    → Alfred_x64-setup.exe
      #   Alfred_0.2.11_x64_en-US.msi    → Alfred_x64_en-US.msi
      #   alfred_0.2.11_amd64.AppImage   → Alfred_amd64.AppImage
      #   alfred_0.2.11_amd64.deb        → Alfred_amd64.deb
      #   alfred-0.2.11-1.x86_64.rpm     → Alfred-1.x86_64.rpm
      # Inclut aussi les artefacts de mise à jour (spec/27) : `.sig` (à côté de
      # chaque installeur signé updater) et `.app.tar.gz`/`.sig` (macOS — c'est
      # cette archive, pas le .dmg, que le plugin updater télécharge).
      - name: Retirer le numéro de version des noms de fichiers
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f \
            \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \
               -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \
               -o -name "*.sig" -o -name "*.tar.gz" \) \
            | while read -r f; do
                dir=$(dirname "$f")
                base=$(basename "$f")
                newbase=$(echo "$base" | sed -E 's/[_-][0-9]+\.[0-9]+\.[0-9]+//; s/^alfred/Alfred/')
                if [ "$base" != "$newbase" ]; then
                  mv "$f" "$dir/$newbase"
                fi
              done

      # Le .app macOS n'est pas uploadé : upload-artifact ne préserve ni les
      # permissions ni les liens symboliques — le .dmg est le livrable (installeur
      # manuel) ; le `.app.tar.gz` (spec/27) est le livrable de MISE À JOUR, une
      # simple archive donc sans ce problème.
      # `*.sig` : présents seulement si les secrets TAURI_SIGNING_PRIVATE_KEY*
      # étaient configurés à l'étape "Build Tauri" — absents sinon, sans faire
      # échouer l'upload (pas de `if-no-files-found: error` par pattern individuel).
      - name: Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: alfred-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig

  # Sur un tag v* uniquement : une fois TOUS les builds verts, crée la release
  # GitHub du tag avec les binaires en pièces jointes (notes générées depuis
  # les commits). Re-run du workflow → les binaires sont re-poussés (--clobber)
  # sur la release existante au lieu d'échouer.
  release:
    name: Release GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Télécharger tous les artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Manifest de mise à jour (spec/27) : lu par tauri-plugin-updater via
      # l'endpoint `releases/latest/download/latest.json` (tauri.conf.json).
      # Écrit dans `artifacts/` AVANT l'étape suivante pour être uploadé avec
      # les binaires par le même `gh release upload`, sans étape dédiée.
      # Windows → le NSIS `.exe` (pas le `.msi`, moins fiable pour un remplacement
      # silencieux) ; macOS → `.app.tar.gz` (PAS le `.dmg` : c'est l'archive que
      # le plugin updater attend). Linux non prioritaire (spec/27, décision) :
      # jamais d'entrée `linux-*`, comportement identique à aujourd'hui (pas
      # d'auto-update sur Linux) — pas juste "pas encore fait".
      # Un `.sig` manquant pour une plateforme (secrets TAURI_SIGNING_PRIVATE_KEY*
      # absents à l'étape "Build Tauri") omet silencieusement son entrée
      # (`::warning::`) plutôt que de faire échouer la release : les autres
      # plateformes restent mises à jour normalement.
      - name: Générer latest.json (spec/27)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          NOTES="Notes de version : https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"

          PLATFORMS="{}"

          WIN_EXE=$(find artifacts -path "*/nsis/*.exe" -type f | head -1 || true)
          WIN_SIG=$(find artifacts -path "*/nsis/*.exe.sig" -type f | head -1 || true)
          if [ -n "$WIN_EXE" ] && [ -n "$WIN_SIG" ]; then
            SIG=$(cat "$WIN_SIG")
            URL="$BASE_URL/$(basename "$WIN_EXE")"
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "$URL" '. + {"windows-x86_64": {signature: $sig, url: $url}}')
          else
            echo "::warning::Pas de .exe/.sig NSIS Windows trouvé — windows-x86_64 omis de latest.json."
          fi

          MAC_TARGZ=$(find artifacts -path "*/macos/*.tar.gz" -type f | head -1 || true)
          MAC_SIG=$(find artifacts -path "*/macos/*.tar.gz.sig" -type f | head -1 || true)
          if [ -n "$MAC_TARGZ" ] && [ -n "$MAC_SIG" ]; then
            SIG=$(cat "$MAC_SIG")
            URL="$BASE_URL/$(basename "$MAC_TARGZ")"
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "$URL" '. + {"darwin-aarch64": {signature: $sig, url: $url}}')
          else
            echo "::warning::Pas de .app.tar.gz/.sig macOS trouvé — darwin-aarch64 omis de latest.json."
          fi

          jq -n --arg version "$VERSION" --arg notes "$NOTES" --arg pub_date "$PUB_DATE" --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' > artifacts/latest.json

          echo "--- latest.json ---"
          cat artifacts/latest.json

      - name: Release + binaires
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          echo "Binaires : ${files[*]}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Alfred $GITHUB_REF_NAME" \
              --generate-notes \
              "${files[@]}"
          fi
