[package]
name = "alfred"
version = "0.1.0"
description = "Alfred — personal assistant desktop app"
authors = ["Tanguy"]
edition = "2021"

[lib]
name = "alfred_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "alfred"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
ts-rs = { version = "10", features = ["serde-compat"] }
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
hound = "3"
rubato = "0.15"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
dirs = "5"
urlencoding = "2"
url = "2"
whisper-rs = { git = "https://github.com/tazz4843/whisper-rs", features = ["metal"], optional = true }

[features]
default = []
whisper = ["whisper-rs"]
