[package]
name = "alfred"
version = "0.2.11"
description = "Alfred — personal assistant desktop app"
authors = ["Tanguy"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "alfred_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "alfred"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
ts-rs = { version = "10", features = ["serde-compat"] }
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
hound = "3"
rubato = "0.15"
anyhow = "1"
thiserror = "2"
dirs = "5"
urlencoding = "2"
url = "2"
# WASAPI loopback (system audio capture) — Windows only. See spec/03.
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19"

# Whisper: Metal acceleration is macOS-only. On other platforms whisper-rs is
# pulled in without Metal (CPU backend). Enable transcription with `--features whisper`.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { git = "https://github.com/tazz4843/whisper-rs", features = ["metal"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { git = "https://github.com/tazz4843/whisper-rs", optional = true }

[features]
# Whisper ships in release builds (spec/04): the `small` model is bundled at
# build time by scripts/fetch-whisper-model.*, so it works offline on first launch.
default = ["whisper"]
whisper = ["whisper-rs"]
